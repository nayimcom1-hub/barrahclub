<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMK Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        .icon-btn { border: none; width: 35px; height: 35px; border-radius: 5px; cursor: pointer; color: white; margin: 2px; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); }
        .modal-content { background: white; width: 400px; margin: 50px auto; padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="dashboard" class="box">
        <h2>অনলাইন এডমিন প্যানেল (BMK SC)</h2><br>
        <h4>নতুন আবেদন</h4>
        <table width="100%" border="1" cellpadding="10" style="border-collapse:collapse">
            <tbody id="reqBody"></tbody>
        </table>
        <br><h4>খেলোয়াড় তালিকা</h4>
        <table width="100%" border="1" cellpadding="10" style="border-collapse:collapse">
            <tbody id="pBody"></tbody>
        </table>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="mContent"></div>
    </div>

    <script>
        // Firebase Config (index.html এর মতই একই কোড দিন)
        const firebaseConfig = {
            apiKey: "AIzaSyCkYMVn0Jh4Oo8Mgm8WyVAOVe65lSLGeks",
  authDomain: "barrahms-app.firebaseapp.com",
  databaseURL: "https://barrahms-app-default-rtdb.firebaseio.com",
  projectId: "barrahms-app",
  storageBucket: "barrahms-app.firebasestorage.app",
  messagingSenderId: "886499355529",
  appId: "1:886499355529:web:051977ab95fdc3d9b5cf58",
  measurementId: "G-34HG0VVZFY"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ডাটা লোড
        db.ref('requests').on('value', snap => {
            const data = snap.val();
            let html = "";
            for(let key in data) {
                html += `<tr><td>${data[key].name}</td><td>
                    <button class="icon-btn" style="background:blue" onclick="view('${key}', 'req')"><i class="fas fa-info"></i></button>
                    <button class="icon-btn" style="background:green" onclick="approve('${key}')"><i class="fas fa-check"></i></button>
                    <button class="icon-btn" style="background:red" onclick="db.ref('requests/${key}').remove()"><i class="fas fa-trash"></i></button>
                </td></tr>`;
            }
            document.getElementById('reqBody').innerHTML = html;
        });

        db.ref('players').on('value', snap => {
            const data = snap.val();
            let html = "";
            for(let key in data) {
                html += `<tr><td><img src="${data[key].pic}" width="30"></td><td>${data[key].name}</td><td>
                    <button class="icon-btn" style="background:${data[key].isStar?'orange':'gray'}" onclick="db.ref('players/${key}').update({isStar:!${data[key].isStar}})">★</button>
                    <button class="icon-btn" style="background:blue" onclick="edit('${key}')"><i class="fas fa-pen"></i></button>
                    <button class="icon-btn" style="background:red" onclick="db.ref('players/${key}').remove()"><i class="fas fa-trash"></i></button>
                </td></tr>`;
            }
            document.getElementById('pBody').innerHTML = html;
        });

        function approve(key) {
            db.ref('requests/' + key).once('value', snap => {
                db.ref('players').push({...snap.val(), isStar: false});
                db.ref('requests/' + key).remove();
            });
        }

        function view(key, type) {
            db.ref(type === 'req' ? 'requests/' + key : 'players/' + key).once('value', snap => {
                const d = snap.val();
                document.getElementById('mContent').innerHTML = `
                    <center><img src="${d.pic}" width="100"></center>
                    <p>নাম: ${d.name}</p><p>পিতা: ${d.father}</p><p>ফোন: ${d.phone}</p><p>ঠিকানা: ${d.address}</p>
                    <button onclick="document.getElementById('modal').style.display='none'">বন্ধ করুন</button>
                `;
                document.getElementById('modal').style.display = 'block';
            });
        }

        function edit(key) {
            db.ref('players/' + key).once('value', snap => {
                const d = snap.val();
                document.getElementById('mContent').innerHTML = `
                    <h3>এডিট তথ্য</h3>
                    <input id="en" value="${d.name}">
                    <input id="ej" value="${d.jersey}">
                    <input id="ep" value="${d.phone}">
                    <button onclick="saveEdit('${key}')">সেভ</button>
                `;
                document.getElementById('modal').style.display = 'block';
            });
        }

        function saveEdit(key) {
            db.ref('players/' + key).update({
                name: document.getElementById('en').value,
                jersey: document.getElementById('ej').value,
                phone: document.getElementById('ep').value
            });
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
